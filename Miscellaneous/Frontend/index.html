<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get & Post Method</title>
</head>
<body>
    <form method="get" action="http://localhost:8080/register">
        <h2>GET Method form</h2>
        <label for="get-username">Username:</label>
        <input type="text" id="get-username" name="username" required>
        <br>
        <br>
        <label for="get-password">Password:</label>
        <input type="password" id="get-password" name="password" required>
        <br><br>
        <button type="submit" class="button">Submit GET</button>


    </form>
<hr>
    <form method="post" action="http://localhost:8080/register">
        <h2>Post Method form</h2>
        <label for="post-username">Username:</label>
        <input type="text" id="post-username" name="username" required>
        <br><br>
        <label for="post-password">Password:</label>
        <input type="password" id="post-password" name="password" required>
        <br><br>
         <label for="post-age">Age:</label>
        <input type="number" id="post-age" name="age"  min="1" max="120" required>
        <br><br>
        <button type="submit" class="button">Submit Post</button>


    </form>
    <script src="app.js"></script>
</body>
</html>
